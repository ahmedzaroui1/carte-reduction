services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo17}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo17}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  audit-seal-init:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - mkdir -p /var/log/odoo-audit && chown 101:101 /var/log/odoo-audit && chmod 0700 /var/log/odoo-audit
    volumes:
      - audit-seal-data:/var/log/odoo-audit

  odoo-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartes-reduction-odoo:17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARTES_HMAC_SECRET: ${CARTES_HMAC_SECRET:?Set_CARTES_HMAC_SECRET_in_.env}
      CARTES_FERNET_KEY: ${CARTES_FERNET_KEY:?Set_CARTES_FERNET_KEY_in_.env}
      CARTES_AUDIT_SEAL_DATABASE: disabled
    command: >
      odoo -c /mnt/extra-addons/cartes_reduction/odoo.conf
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/opt/odoo-addons
      --init=base,cartes_reduction
      --stop-after-init
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.conf:/mnt/extra-addons/cartes_reduction/odoo.conf

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartes-reduction-odoo:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
      audit-seal-init:
        condition: service_completed_successfully
    expose:
      - "8069"
      - "8072"
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - DATABASE=${POSTGRES_DB:-odoo17}
      - ADDONS_PATH=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/opt/odoo-addons
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-odoo}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - DB_DATABASE=${POSTGRES_DB:-odoo17}
      - "CARTES_HMAC_SECRET=${CARTES_HMAC_SECRET:?Set_CARTES_HMAC_SECRET_in_.env}"
      - "CARTES_FERNET_KEY=${CARTES_FERNET_KEY:?Set_CARTES_FERNET_KEY_in_.env}"
      - "CARTES_AUDIT_SEAL_DATABASE=${POSTGRES_DB:-odoo17}"
    volumes:
      - odoo-data:/var/lib/odoo
      - audit-seal-data:/var/log/odoo-audit
      - ./odoo.conf:/mnt/extra-addons/cartes_reduction/odoo.conf
    entrypoint:
      - /bin/sh
      - /opt/odoo-addons/cartes_reduction/docker/odoo-secrets-entrypoint.sh
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,size=64k,uid=101,gid=101,mode=0700
    secrets:
      - source: audit_seal_hmac_key
        target: /run/secrets-source/audit_seal_hmac_key
      - source: metrics_bearer_token
        target: /run/secrets-source/metrics_bearer_token
    command: >
      odoo -c /mnt/extra-addons/cartes_reduction/odoo.conf
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/opt/odoo-addons
      --proxy-mode
      --db-filter=^odoo17$
      -d ${POSTGRES_DB:-odoo17}

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "8069:8069"
      - "${STAFF_BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      - ./nginx/odoo-security.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - monitoring_internal

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/run/secrets/prometheus_web_config.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${MONITORING_BIND_IP:-192.168.108.129}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - source: metrics_bearer_token
        target: /run/secrets/metrics_bearer_token
      - source: prometheus_web_config
        target: /run/secrets/prometheus_web_config.yml
    networks:
      monitoring_internal:
        ipv4_address: 172.30.0.10

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "${MONITORING_BIND_IP:-192.168.108.129}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - source: grafana_admin_password
        target: /run/secrets/grafana_admin_password
      - source: prometheus_basic_auth_password
        target: /run/secrets/prometheus_basic_auth_password
    networks:
      - monitoring_internal

  e2e-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartes-reduction-odoo:17
    container_name: cartes_reduction-e2e-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8075:8069"
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - DATABASE=odoo17_e2e_tnd
      - ADDONS_PATH=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/opt/odoo-addons
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-odoo}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - DB_DATABASE=odoo17_e2e_tnd
      - "CARTES_HMAC_SECRET=${CARTES_HMAC_SECRET:?Set_CARTES_HMAC_SECRET_in_.env}"
      - "CARTES_FERNET_KEY=${CARTES_FERNET_KEY:?Set_CARTES_FERNET_KEY_in_.env}"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.conf:/mnt/extra-addons/cartes_reduction/odoo.conf
    command: >
      odoo -c /mnt/extra-addons/cartes_reduction/odoo.conf
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/opt/odoo-addons
      -d odoo17_e2e_tnd

volumes:
  pg-data:
  odoo-data:
  audit-seal-data:
  prometheus-data:
  grafana-data:

secrets:
  audit_seal_hmac_key:
    file: ./secrets/audit_seal_hmac_key
  metrics_bearer_token:
    file: ./secrets/metrics_bearer_token
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  prometheus_basic_auth_password:
    file: ./secrets/prometheus_basic_auth_password
  prometheus_web_config:
    file: ./secrets/prometheus_web_config.yml

networks:
  default:
  monitoring_internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
