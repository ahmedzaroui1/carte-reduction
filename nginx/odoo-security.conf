map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_cookie $cookies_without_legacy_session {
    default $http_cookie;
    "~*(.*?)((;[[:space:]]*)?session_id=[^;]*)(.*)$" "$1$4";
}

map $cookies_without_legacy_session $cookies_without_staff_sid {
    default $cookies_without_legacy_session;
    "~*(.*?)((;[[:space:]]*)?sotufab_staff_sid=[^;]*)(.*)$" "$1$4";
}

map $cookies_without_legacy_session $cookies_without_shop_sid {
    default $cookies_without_legacy_session;
    "~*(.*?)((;[[:space:]]*)?sotufab_shop_sid=[^;]*)(.*)$" "$1$4";
}

map $cookies_without_staff_sid $odoo_shop_cookie {
    default $cookies_without_staff_sid;
    "~*(.*?)((;[[:space:]]*)?sotufab_shop_sid=([^;]*))(.*)$" "$1$3session_id=$4$5";
}

map $cookies_without_shop_sid $odoo_staff_cookie {
    default $cookies_without_shop_sid;
    "~*(.*?)((;[[:space:]]*)?sotufab_staff_sid=([^;]*))(.*)$" "$1$3session_id=$4$5";
}

map $upstream_cookie_session_id $shop_cookie_expiration {
    "" "; Max-Age=0";
    default "; Max-Age=604800";
}

map $upstream_cookie_session_id $staff_cookie_expiration {
    "" "; Max-Age=0";
    default "; Max-Age=604800";
}

map $upstream_http_set_cookie $shop_session_cookie {
    default "";
    "~*session_id=" "sotufab_shop_sid=$upstream_cookie_session_id; Path=/; HttpOnly; SameSite=Lax$shop_cookie_expiration";
}

map $upstream_http_set_cookie $staff_session_cookie {
    default "";
    "~*session_id=" "sotufab_staff_sid=$upstream_cookie_session_id; Path=/; HttpOnly; SameSite=Lax$staff_cookie_expiration";
}

limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=odoo_otp:10m rate=30r/m;
limit_req_status 429;
server_tokens off;

log_format odoo '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent';

upstream odoo_http {
    server web:8069;
}

upstream odoo_websocket {
    server web:8072;
}

# Map Odoo's session cookie to per-port names on responses and back to session_id upstream.
server {
    listen 8069;
    server_name _;
    client_max_body_size 100m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Set-Cookie $shop_session_cookie always;
    access_log /var/log/nginx/access.log odoo;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Sotufab-Portal public;
    proxy_set_header Cookie $odoo_shop_cookie;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 60s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    location = / {
        return 302 /shop;
    }

    location = /web {
        return 403;
    }

    location ^~ /web/database {
        return 403;
    }

    location = /web/login {
        limit_req zone=odoo_login burst=10 nodelay;
        proxy_pass http://odoo_http;
    }

    location = /web/signup {
        proxy_pass http://odoo_http;
    }

    location = /web/binary/company_logo {
        proxy_pass http://odoo_http;
    }

    location ^~ /web/assets/ {
        proxy_pass http://odoo_http;
    }

    location ^~ /web/image/ {
        proxy_pass http://odoo_http;
    }

    location ^~ /web/content/ {
        proxy_pass http://odoo_http;
    }

    location = /web/session/logout {
        proxy_pass http://odoo_http;
    }

    location = /logo.png {
        proxy_pass http://odoo_http;
    }

    location /web/ {
        return 403;
    }

    location = /pos {
        return 403;
    }

    location ^~ /pos/ {
        return 403;
    }

    location = /staff {
        return 403;
    }

    location ^~ /staff/ {
        return 403;
    }

    location = /website_sale/get_combination_info {
        proxy_pass http://odoo_http;
    }

    location = /sale_product_configurator/show_advanced_configurator {
        proxy_pass http://odoo_http;
    }

    location = /shop {
        proxy_pass http://odoo_http;
    }

    location ^~ /shop/ {
        proxy_pass http://odoo_http;
    }

    location = /my {
        proxy_pass http://odoo_http;
    }

    location ^~ /my/ {
        proxy_pass http://odoo_http;
    }

    location = /payment {
        proxy_pass http://odoo_http;
    }

    location ^~ /payment/ {
        proxy_pass http://odoo_http;
    }

    location = /cartes_reduction {
        proxy_pass http://odoo_http;
    }

    location = /cartes_reduction/metrics {
        return 403;
    }

    location ^~ /cartes_reduction/ {
        proxy_pass http://odoo_http;
    }

    location = /my/cartes/otp {
        limit_req zone=odoo_otp burst=10 nodelay;
        proxy_pass http://odoo_http;
    }

    location = /websocket {
        proxy_pass http://odoo_websocket;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Sotufab-Portal public;
        proxy_set_header Cookie $odoo_shop_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /websocket/ {
        proxy_pass http://odoo_websocket;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Sotufab-Portal public;
        proxy_set_header Cookie $odoo_shop_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        return 403;
    }
}

server {
    listen 8090;
    server_name _;
    allow 127.0.0.1/32;
    allow 172.18.0.1/32;
    allow 172.30.0.10/32;
    allow 192.168.108.0/24;
    deny all;
    client_max_body_size 100m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Set-Cookie $staff_session_cookie always;
    access_log /var/log/nginx/access.log odoo;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Sotufab-Portal internal;
    proxy_set_header Cookie $odoo_staff_cookie;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 60s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    location = / {
        return 302 /staff/login;
    }

    location = /web/login {
        return 302 /staff/login;
    }

    location = /web/database {
        return 403;
    }

    location ^~ /web/database/ {
        return 403;
    }

    location = /web/signup {
        return 403;
    }

    location = /web/reset_password {
        return 403;
    }

    location = /shop {
        return 403;
    }

    location ^~ /shop/ {
        return 403;
    }

    location = /my {
        return 403;
    }

    location ^~ /my/ {
        return 403;
    }

    location = /staff {
        return 302 /staff/login;
    }

    location = /staff/login {
        limit_req zone=odoo_login burst=10 nodelay;
        proxy_pass http://odoo_http;
    }

    location = /websocket {
        proxy_pass http://odoo_websocket;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Sotufab-Portal internal;
        proxy_set_header Cookie $odoo_staff_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /websocket/ {
        proxy_pass http://odoo_websocket;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Sotufab-Portal internal;
        proxy_set_header Cookie $odoo_staff_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ ^/web/dataset/call_kw/res\.partner/(action_send_pos_otp|verify_pos_otp_or_qr)/?$ {
        limit_req zone=odoo_otp burst=10 nodelay;
        proxy_pass http://odoo_http;
    }

    location = /web {
        proxy_pass http://odoo_http;
    }

    location /web/ {
        proxy_pass http://odoo_http;
    }

    location = /pos {
        proxy_pass http://odoo_http;
    }

    location ^~ /pos/ {
        proxy_pass http://odoo_http;
    }

    location = /cartes_reduction {
        proxy_pass http://odoo_http;
    }

    location = /cartes_reduction/metrics {
        proxy_pass http://odoo_http;
    }

    location ^~ /cartes_reduction/ {
        proxy_pass http://odoo_http;
    }

    location = /bus/websocket_worker_bundle {
        proxy_pass http://odoo_http;
    }

    location = /mail/init_messaging {
        proxy_pass http://odoo_http;
    }

    location ^~ /mail/static/ {
        proxy_pass http://odoo_http;
    }

    location ^~ /mail/ {
        proxy_pass http://odoo_http;
    }

    location ~* ^/[a-zA-Z0-9_]+/static/ {
        proxy_pass http://odoo_http;
    }

    location = /longpolling {
        proxy_pass http://odoo_websocket;
    }

    location ^~ /longpolling/ {
        proxy_pass http://odoo_websocket;
    }

    location ^~ /point_of_sale/static/ {
        proxy_pass http://odoo_http;
    }

    location ^~ /website/translations/ {
        proxy_pass http://odoo_http;
    }

    location = /favicon.ico {
        proxy_pass http://odoo_http;
    }

    location / {
        return 403;
    }
}
